<!doctype html>
<html lang="zh-CN">
  <head>
    {{> head.html}}
  </head>
  <body class="page-{{PAGE_KEY}}">
    <a class="skip-link" href="#main">跳到主要内容</a>
    {{> icons.html}}
    {{> header.html}}

    <main id="main" class="not-found">
      <p class="corp-kicker">404 / NOT FOUND</p>
      <h1>这页星星走丢了</h1>
      <p class="page-lead">你访问的页面不存在或已经移动。可以回到首页，或者从下面这些入口继续。</p>
      <div class="corp-actions">
        <a class="btn btn--ink" href="/">回到首页<svg class="icon" aria-hidden="true"><use href="#i-arrow-up-right"></use></svg></a>
        <a class="btn btn--quiet" href="/product/">产品说明</a>
        <a class="btn btn--quiet" href="/about/">公司介绍</a>
      </div>
      <p class="content-note">如果你是从站内链接来到这里的，欢迎通过 <a href="mailto:{{BRAND_EMAIL}}">{{BRAND_EMAIL}}</a> 告诉我们。</p>
    </main>

    {{> footer.html}}
    {{> scripts.html}}
  </body>
</html>
