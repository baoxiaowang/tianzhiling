<aside class="hero-cinema" aria-label="窗边空椅子与一封手写信的影像">

    <img src="/assets/hero-cinema.webp" alt="黄昏窗边的一把空木椅，椅面上放着一封手写信" width="1200" height="1500" loading="eager" decoding="async" fetchpriority="high">
  </figure>
  <p class="hero-cinema__caption">有些话，可以慢慢说。</p>
  <div class="hero-cinema__entry">
    <img class="hero-cinema__qr" src="{{WEAPP_QR_PATH}}" width="52" height="52" alt="{{BRAND_NAME}}微信小程序码" loading="lazy">
    <div>
      <strong>扫码进入{{BRAND_NAME}}</strong>
      <small>微信小程序 · 记忆空间</small>
    </div>
  </div>
</aside>
