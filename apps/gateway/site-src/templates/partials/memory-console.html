<aside class="memory-console" aria-label="数字亲人记忆界面示意">
  <div class="memory-console__top">
    <span>MEMORY CORE / 01</span>
    <span class="memory-console__live"><i aria-hidden="true"></i>SYNCED</span>
  </div>

  <div class="memory-console__stage">
    {{> digital-relative.html}}
    <div class="memory-console__chip memory-console__chip--voice"><span>VOICE</span><strong>98.2%</strong></div>
    <div class="memory-console__chip memory-console__chip--memory"><span>MEMORY</span><strong>12,480</strong></div>
    <div class="memory-console__chip memory-console__chip--relation"><span>RELATION</span><strong>女儿</strong></div>
  </div>

  <div class="memory-console__prompt">
    <span>AI MEMORY RESPONSE / 示意</span>
    <p>“我记得，你上次说想再听一次那首歌。”</p>
  </div>

  <div class="memory-console__foot">
    <img class="memory-console__qr" src="{{WEAPP_QR_PATH}}" width="74" height="74" alt="{{BRAND_NAME}}微信小程序码" loading="lazy">
    <div>
      <strong>扫码进入{{BRAND_NAME}}</strong>
      <small>微信小程序 · 数字亲人记忆空间</small>
    </div>
  </div>
  <p class="memory-console__caption">界面为产品示意，非真人；实际以小程序内为准。</p>
</aside>
