<script>
  (function () {
    function scrollToId(id, smooth) {
      if (!id) return;
      var target = document.getElementById(id);
      if (!target) return;
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      target.scrollIntoView({
        block: "start",
        behavior: smooth && !reduceMotion ? "smooth" : "auto",
      });
    }

    function hashId(hash) {
      try {
        return decodeURIComponent(hash.replace(/^#/, ""));
      } catch (error) {
        return hash.replace(/^#/, "");
      }
    }

    // 同页的 /#anchor 链接默认会被浏览器当成一次导航，首屏可能不滚动；
    // 这里改走 pushState + scrollIntoView，保留可分享的 URL。
    document.addEventListener("click", function (event) {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      var link = event.target.closest ? event.target.closest("a[href]") : null;
      if (!link || (link.target && link.target !== "_self")) return;
      var url;
      try {
        url = new URL(link.getAttribute("href"), window.location.href);
      } catch (error) {
        return;
      }
      if (url.origin !== window.location.origin || url.pathname !== window.location.pathname || !url.hash) return;
      event.preventDefault();
      window.history.pushState(null, "", url.hash);
      scrollToId(hashId(url.hash), true);
    });

    // 从其他页面跳到 /#anchor 或 /about/#contact 时，等布局稳定后再对齐。
    window.addEventListener("load", function () {
      if (window.location.hash) {
        window.setTimeout(function () {
          scrollToId(hashId(window.location.hash), false);
        }, 0);
      }
    });

    // 直接修改 hash、浏览器前进/后退或同页跳转时兜底。
    window.addEventListener("hashchange", function () {
      if (window.location.hash) {
        scrollToId(hashId(window.location.hash), true);
      }
    });
  })();

  // 产品页侧边目录：按当前路径高亮；每个条目是独立页面。
  (function () {
    var nav = document.querySelector("[data-product-nav]");
    if (!nav) return;
    var track = nav.querySelector("[data-product-track]");
    var bar = nav.querySelector("[data-product-progress]");
    var links = Array.prototype.slice.call(nav.querySelectorAll("a[data-product-link]"));
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function normalise(path) {
      return path.replace(/\/+$/, "") || "/";
    }

    var path = normalise(window.location.pathname);
    var active = null;
    links.forEach(function (link) {
      var linkPath = normalise(new URL(link.getAttribute("href"), window.location.href).pathname);
      var isActive = linkPath === path;
      link.classList.toggle("is-active", isActive);
      if (isActive) {
        link.setAttribute("aria-current", "page");
        active = link;
      } else {
        link.removeAttribute("aria-current");
      }
    });

    if (active && track && track.scrollWidth > track.clientWidth) {
      var target = active.offsetLeft - (track.clientWidth - active.offsetWidth) / 2;
      try {
        track.scrollTo({ left: Math.max(0, target), behavior: reduceMotion ? "auto" : "smooth" });
      } catch (error) {
        track.scrollLeft = Math.max(0, target);
      }
    }

    function updateProgress() {
      if (!bar) return;
      var scrollY = window.scrollY || window.pageYOffset;
      var maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      bar.style.width = Math.min(100, Math.max(0, (scrollY / maxScroll) * 100)) + "%";
    }

    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    updateProgress();
  })();

  // 低风险动效：首屏以下的内容进入视口时轻轻上浮；减少动态偏好下完全跳过。
  (function () {
    if (!("IntersectionObserver" in window)) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var nodes = Array.prototype.slice.call(document.querySelectorAll(".corp-section, .corp-visual"));
    var viewport = window.innerHeight || document.documentElement.clientHeight;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.06 });

    nodes.forEach(function (node) {
      var rect = node.getBoundingClientRect();
      if (rect.top < viewport * 0.92) return;
      node.classList.add("reveal");
      observer.observe(node);
    });
  })();

  // 首页主视觉的轻微视差；只在桌面端开启，避免移动端滚动手感变重。
  (function () {
    var visual = document.querySelector(".corp-visual");
    if (!visual) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (window.innerWidth < 900) return;
    var image = visual.querySelector(".corp-visual__image");
    if (!image) return;
    var queued = false;

    function update() {
      var rect = visual.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) return;
      var progress = (window.innerHeight - rect.top) / (window.innerHeight + rect.height);
      var offset = (progress - 0.5) * 34;
      image.style.transform = "translate3d(0, " + offset.toFixed(2) + "px, 0) scale(1.06)";
    }

    function schedule() {
      if (queued) return;
      queued = true;
      window.requestAnimationFrame(function () {
        queued = false;
        update();
      });
    }

    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule);
    update();
  })();

  // 产品子页面在悬停/聚焦时预取，点击时更快。
  (function () {
    var seen = {};
    function prefetch(link) {
      var href = link.href;
      if (!href || seen[href]) return;
      seen[href] = true;
      var hint = document.createElement("link");
      hint.rel = "prefetch";
      hint.href = href;
      document.head.appendChild(hint);
    }
    Array.prototype.forEach.call(document.querySelectorAll("a[data-product-link]"), function (link) {
      link.addEventListener("mouseenter", function () { prefetch(link); }, { passive: true });
      link.addEventListener("focus", function () { prefetch(link); });
    });
  })();
</script>
