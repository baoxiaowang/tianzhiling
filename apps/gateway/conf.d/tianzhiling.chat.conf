server {
  listen 80;
  server_name tianzhiling.chat www.tianzhiling.chat;

  include /etc/nginx/includes/health.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name tianzhiling.chat www.tianzhiling.chat;

  resolver 127.0.0.11 ipv6=off valid=30s;
  set $tzl_node_backend http://tzl_node:7001;
  root /usr/share/nginx/html/site;
  index index.html;

  include /etc/nginx/includes/ssl-tianzhiling-chat.conf;

  include /etc/nginx/includes/security-headers.conf;

  client_max_body_size 50m;

  include /etc/nginx/includes/health.conf;

  location /api/ {
    proxy_pass $tzl_node_backend;
    include /etc/nginx/includes/proxy-headers.conf;
    include /etc/nginx/includes/proxy-timeouts.conf;
    proxy_buffering off;
  }

  location /public/ {
    proxy_pass $tzl_node_backend;
    include /etc/nginx/includes/proxy-headers.conf;
    include /etc/nginx/includes/proxy-timeouts.conf;
  }

  location = /a580e31dc759536fcc7eeedef52bc7ee.txt {
    default_type text/plain;
    return 200 "a580e31dc759536fcc7eeedef52bc7ee";
  }

  location = /baidu_verify_codeva-hHvopWkE12.html {
    default_type text/html;
    return 200 "3550d61e3175e70638041e5d9ed381f1";
  }

  location = /favicon.ico {
    return 301 /assets/favicon.svg;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/includes/security-headers.conf;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
}
