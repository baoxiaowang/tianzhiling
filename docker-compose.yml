x-milvus-logging: &milvus-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  # tzl_web:
  #   profiles: ["prod"]  # 这个配置表示该服务只在运行 docker-compose --profile prod up 命令时才会启动，用于区分开发和生产环境
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile
  #   ports:
  #     - 17080:80
  #   depends_on:
  #     - pms
  #   networks:
  #     - tzl-network

  tzl_node:
    profiles: ["prod"] # 这个配置表示该服务只在运行 docker-compose --profile prod up 命令时才会启动，用于区分开发和生产环境
    container_name: tzl_node
    # 用户端权重：cpu.shares 只在 CPU 争抢时生效。给用户端最高权重，
    # 保证任何后台任务（记忆抽取、统计、回填）都不会把它挤到没 CPU 可用；
    # 用户端空闲时后台仍能使用剩余核。tzl_memory_worker 对应给最低权重。
    cpu_shares: 4096
    build:
      context: .
      dockerfile: apps/node/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    env_file:
      - .env
    environment:
      NODE_PORT: 7001
      NODE_REDIS_HOST: tzl_redis
      NODE_REDIS_PORT: 6379
      NODE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NODE_REDIS_DB: ${REDIS_DB:-0}
      NODE_MONGO_HOST: tzl_mongo
      NODE_MONGO_PORT: 27017
      NODE_MONGO_DB: ${MONGO_DB:-tzl}
      NODE_MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      NODE_MONGO_USERNAME: ${MONGO_USERNAME:-admin}
      NODE_MONGO_PASSWORD: ${MONGO_PASSWORD:-qwerasdf}
      NODE_MILVUS_ADDRESS: standalone:19530
      NODE_RUNTIME_ROLE: web
      # 回复链路追踪关闭：追踪用 AsyncLocalStorage 承载 traceId，ALS 会给链路里
      # 每个 promise 增加 async_hooks 传播开销（实测占聊天端 CPU 一半以上）。
      # 需要排查回复链路时把它改成 "true" 再发布一次。
      NODE_CHAT_TRACE_ENABLED: "false"
      RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    expose:
      - "7001"
    volumes:
      - ${TZL_CERTS_DIR:-/etc/tzl/certs}:/workspace/resource/cert:ro
    depends_on:
      - tzl_redis
      - tzl_mongo
    networks:
      - tzl-network
    restart: always

  tzl_memory_worker:
    profiles: ["prod"]
    container_name: tzl_memory_worker
    image: tianzhiling-tzl_node
    # 内存硬上限（2026-11-03 用户选择方案 A）：正常占用 0.5~0.7G，
    # 涨到 2G 由 cgroup OOM 杀掉并自动重启，避免再次把宿主机/ milvus 拖进 OOM。
    mem_limit: 2g
    memswap_limit: 2g
    # 记忆后台的 CPU 保护上限（候选值，不是吞吐目标）。生产此前无有效上限才新增；
    # 并发由 NODE_MEMORY_WORKER_CONCURRENCY 控制：2026-09-17 起为 3，用于消化
    # Mongo COLLSCAN 期间积压的 pending 任务；清完可回落到 2。
    # 2026-09-18：1.5 核实测被 cgroup 限流（15 小时内约 3.2 小时 throttled），
    # 抬到 2.5 核；未超过宿主机 4 核，其余容器均无 CPU 上限。
    cpus: "2.5"
    # 后台最低权重：CPU 争抢时永远给 tzl_node（4096）让路，用户端空闲时才用满配额。
    # 注意这不是上限（上限是上面的 cpus），只是争抢时的相对比例。
    cpu_shares: 128
    env_file:
      - .env
    environment:
      NODE_PORT: 7001
      NODE_REDIS_HOST: tzl_redis
      NODE_REDIS_PORT: 6379
      NODE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      NODE_REDIS_DB: ${REDIS_DB:-0}
      NODE_MONGO_HOST: tzl_mongo
      NODE_MONGO_PORT: 27017
      NODE_MONGO_DB: ${MONGO_DB:-tzl}
      NODE_MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      NODE_MONGO_USERNAME: ${MONGO_USERNAME:-admin}
      NODE_MONGO_PASSWORD: ${MONGO_PASSWORD:-qwerasdf}
      NODE_MILVUS_ADDRESS: standalone:19530
      NODE_RUNTIME_ROLE: memory-worker
      NODE_MEMORY_WORKER_CONCURRENCY: 3
      # 主应用自愈重启（bootstrap 监管进程执行，只换主应用进程、不动容器）：
      # 每 4 小时兜底重启一次，或 RSS 超过 3400MB 提前重启，至少运行 30 分钟才允许重启。
      # 目的是不让堆涨到约 3GB 后陷入 GC 病态，把完成吞吐从 500/h 拖到 280/h。
      NODE_MEMORY_WORKER_MAIN_RESTART_INTERVAL_MS: "14400000"
      # 2026-11-03：app 级优雅重启阈值从 3400MB 下调到 1400MB（低于 2G 硬上限），
      # 让「优雅重启」先于「cgroup OOM 杀容器」发生。
      NODE_MEMORY_WORKER_MAIN_RESTART_RSS_MB: "1400"
      NODE_OPTIONS: ${NODE_MEMORY_WORKER_NODE_OPTIONS:---heapsnapshot-signal=SIGUSR2}
      RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    command:
      [
        "node",
        "./scripts/memory-worker-bootstrap.js",
      ]
    volumes:
      - ${TZL_CERTS_DIR:-/etc/tzl/certs}:/workspace/resource/cert:ro
    depends_on:
      - tzl_redis
      - tzl_mongo
      - standalone
    networks:
      - tzl-network
    restart: always

  tzl_admin_node:
    profiles: ["prod"]
    container_name: tzl_admin_node
    build:
      context: .
      dockerfile: apps/admin-node/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    env_file:
      - .env
    environment:
      ADMIN_API_PORT: 7101
      RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
      ADMIN_API_REDIS_HOST: tzl_redis
      ADMIN_API_REDIS_PORT: 6379
      ADMIN_API_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ADMIN_API_REDIS_DB: ${REDIS_DB:-0}
      ADMIN_API_MONGO_HOST: tzl_mongo
      ADMIN_API_MONGO_PORT: 27017
      ADMIN_API_MONGO_DB: ${MONGO_DB:-tzl}
      ADMIN_API_MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
      ADMIN_API_MONGO_USERNAME: ${MONGO_USERNAME:-admin}
      ADMIN_API_MONGO_PASSWORD: ${MONGO_PASSWORD:-qwerasdf}
      # 抖评（comment-admin）内部接口：每日推广费来源
      DOUYIN_REVIEW_BASE_URL: ${DOUYIN_REVIEW_BASE_URL:-http://comment-admin:8890}
      DOUYIN_REVIEW_PASSWORD: ${DOUYIN_REVIEW_PASSWORD:-}
    expose:
      - "7101"
    volumes:
      - ${TZL_CERTS_DIR:-/etc/tzl/certs}:/workspace/resource/cert:ro
    depends_on:
      - tzl_redis
      - tzl_mongo
    networks:
      - tzl-network
    restart: always

  tzl_admin_web:
    profiles: ["prod"]
    container_name: tzl_admin_web
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    expose:
      - "80"
    networks:
      - tzl-network
    restart: always

  tzl_nginx:
    profiles: ["prod"]
    container_name: tzl_nginx
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-unknown}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./apps/gateway/ssl:/etc/nginx/ssl:ro
    depends_on:
      - tzl_node
      - tzl_admin_node
      - tzl_admin_web
    networks:
      - tzl-network
    restart: always

  # 人声分离 sidecar：UVR-MDX-NET（onnx）去背景音乐，供声音训练切片前使用。
  # 模型放在 volumes/models/uvr/（不进 git），只读挂载。
  tzl_voice_sep:
    profiles: ["prod"]
    container_name: tzl_voice_sep
    # 分窗处理（8s/0.5s 交叠）后单窗口峰值约 2.5G，留 1G 余量
    mem_limit: 3500m
    build:
      context: apps/voice-separator
      dockerfile: Dockerfile
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/models/uvr:/models:ro
    environment:
      - SEP_THREADS=${VOICE_SEP_THREADS:-2}
      - SEP_MAX_SECONDS=${VOICE_SEP_MAX_SECONDS:-120}
      - SEP_CHUNK_SECONDS=${VOICE_SEP_CHUNK_SECONDS:-4}
      - SEP_OVERLAP_SECONDS=${VOICE_SEP_OVERLAP_SECONDS:-0.4}
      # 处理完即退出，规避 onnxruntime arena 不归还内存（容器自动重启）
      - SEP_EXIT_AFTER_REQUEST=${VOICE_SEP_EXIT_AFTER_REQUEST:-1}
    expose:
      - "8900"
    networks:
      - tzl-network
    restart: unless-stopped

  # 自建人脸识别 sidecar：只做检测 / 质量分 / 128 维编码（CPU，无 GPU）。
  # 由 tzl_node 通过 http://tzl_face_sidecar:8899 调用。
  tzl_face_sidecar:
    profiles: ["prod"]
    container_name: tzl_face_sidecar
    mem_limit: 800m
    build:
      context: apps/face-sidecar
      dockerfile: Dockerfile
    expose:
      - "8899"
    networks:
      - tzl-network
    restart: unless-stopped

  tzl_redis:
    container_name: tzl_redis
    image: redis:latest
    privileged: true
    sysctls:
      net.core.somaxconn: 1024
    ports:
      - ${REDIS_PORT:-17380}:6379
    volumes:
      - redis_data:/data
    networks:
      - tzl-network
    restart: always

  tzl_mongo:
    container_name: tzl_mongo
    image: mongo:6
    privileged: true
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-qwerasdf}
    ports:
      - "127.0.0.1:${MONGO_PORT:-17271}:27017"
    volumes:
      # - tzl_mongo_data:/data/db
      # - tzl_mongo_logs:/var/log/mongodb
      # - tzl_mongo_config:/data/configdb
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo:/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo/log:/var/log/mongodb
    networks:
      - tzl-network
    restart: always
    command: ["--wiredTigerCacheSizeGB", "1"]
    ulimits:
      nproc: 64000
      nofile:
        soft: 64000
        hard: 64000

  # mongo-express:
  #   image: mongo-express
  #   container_name: mongo-express
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_OPTIONS_EDITORTHEME: 3024-night
  #     ME_CONFIG_MONGODB_SERVER: mongo
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: admin
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: qwerasdf
  #     ME_CONFIG_MONGODB_PORT: 27017
  #     ME_CONFIG_BASICAUTH_USERNAME: admin
  #     ME_CONFIG_BASICAUTH_PASSWORD: admin
  #   networks:
  #     - tzl-network
  #   depends_on:
  #     - tzl_mongo

  etcd:
    container_name: tzl-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    networks:
      - tzl-network
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - 127.0.0.1:${ETCD_PORT:-17239}:2379
    restart: unless-stopped
    logging: *milvus-logging

  minio:
    container_name: tzl_minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-17902}:9002"
      - "127.0.0.1:${MINIO_API_PORT:-17900}:9000"
    networks:
      - tzl-network
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9002"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    logging: *milvus-logging

  standalone:
    container_name: tzl-milvus-standalone
    image: milvusdb/milvus:v2.6.22
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:${MILVUS_PORT:-17953}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-19091}:9091"
    networks:
      - tzl-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging: *milvus-logging

volumes:
  redis_data:
    driver: local
  tzl_mongo_data:
    driver: local
  tzl_mongo_config:
    driver: local
  tzl_mongo_logs:
    driver: local

networks:
  tzl-network:
    driver: bridge
    name: tzl-network
